name: Android CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Kotlin formatting
        run: ./gradlew spotlessCheck --build-cache --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testGithubDebugUnitTest :app:testFossDebugUnitTest --max-workers=1 --build-cache --stacktrace

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias flowkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Flow, OU=Flow, O=Flow, L=City, ST=State, C=US" \
            -storepass password -keypass password

      - name: Build Stable Release APKs (arm64)
        run: ./gradlew :app:assembleGithubRelease :app:assembleFossRelease --max-workers=1 --build-cache --stacktrace
        env:
          STORE_PASSWORD: password
          KEY_ALIAS: flowkey
          KEY_PASSWORD: password

      - name: Prepare Release Assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/github/release/*.apk dist/flow-arm64-v8a.apk
          cp app/build/outputs/apk/foss/release/*.apk dist/flow-foss-arm64-v8a.apk
          cd dist
          sha256sum *.apk > checksums.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Flow ${{ github.ref_name }}
          files: |
            dist/flow-arm64-v8a.apk
            dist/flow-foss-arm64-v8a.apk
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
